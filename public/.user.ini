; Optional: per-directory PHP overrides for hosts that support .user.ini
; (php-fpm / CGI). Ignored on servers that don't — edit the real php.ini instead.
; NOTE: .user.ini is cached for up to user_ini.cache_ttl seconds (default 300),
; so changes may take a few minutes to take effect.
upload_max_filesize = 4G
post_max_size = 4G
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
